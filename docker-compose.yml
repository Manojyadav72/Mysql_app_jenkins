services:
  mysql:
    image: mysql:8.4
    container_name: tanmay
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: flask_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost","-uroot","-prootpass123"]
      interval: 5s
      timeout: 30s
      retries: 20
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tanmay123
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: appuser
      DB_PASSWORD: apppass123
      DB_NAME: flask_db
volumes:
  mysql_data: